<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171820">
<meta name="description" content="Escuchá sikodark radio en directo y descubrí la música que ya sonó.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="apple-icon.png">
<link rel="apple-touch-icon" href="apple-icon.png">
<title>sikodark radio</title>
<style>
:root{color-scheme:dark;--bg:#171820;--card:#22232b;--secondary:#2c2d35;--text:#f5f5f7;--muted:#a5a6ad;--primary:#ff8a24;--border:rgba(255,255,255,.1);--radius:18px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 16px}
.wrap{width:100%;max-width:448px}.card{border:1px solid var(--border);background:var(--card);border-radius:28px;padding:24px;box-shadow:0 20px 55px rgba(0,0,0,.35)}
@media(min-width:640px){.card{padding:32px}}
.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover}.eyebrow,.mono{font-family:monospace}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}.brand-name{font-size:14px;font-weight:700;margin-top:2px}
.status{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 11px;font:11px monospace;text-transform:uppercase;letter-spacing:.08em;background:var(--secondary);color:var(--muted)}.status.live{background:rgba(255,138,36,.14);color:var(--primary)}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.live .dot{background:var(--primary);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35}}
.cover{position:relative;margin-top:24px;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--secondary)}.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.eq{position:absolute;left:0;right:0;bottom:0;height:34%;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:32px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent)}.bar{width:10px;height:12px;border-radius:8px;background:var(--primary);opacity:.4}.playing .bar{opacity:1;animation:bounce .8s ease-in-out infinite alternate}.playing .bar:nth-child(2){animation-delay:.09s}.playing .bar:nth-child(3){animation-delay:.18s}.playing .bar:nth-child(4){animation-delay:.27s}.playing .bar:nth-child(5){animation-delay:.36s}.playing .bar:nth-child(6){animation-delay:.45s}.playing .bar:nth-child(7){animation-delay:.54s}.playing .bar:nth-child(8){animation-delay:.63s}.playing .bar:nth-child(9){animation-delay:.72s}@keyframes bounce{to{height:75%}}
.now{margin-top:24px;min-height:64px;text-align:center}.now .eyebrow{margin-bottom:5px}.title{margin:0;font-size:19px;font-weight:800;line-height:1.2}.artist{margin:5px 0 0;color:var(--muted);font-size:14px}
.controls{margin-top:24px;display:flex;align-items:center;gap:16px}.play{width:64px;height:64px;flex:0 0 64px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#191919;cursor:pointer;box-shadow:0 8px 25px rgba(255,138,36,.2);transition:transform .15s}.play:hover{transform:scale(1.05)}.play svg{width:28px;height:28px;fill:currentColor}.volume{display:flex;align-items:center;gap:12px;flex:1}.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:3px;display:grid;place-items:center}.icon-btn:hover{color:var(--text)}input[type=range]{width:100%;accent-color:var(--primary)}
.install{margin-top:24px;width:100%;padding:12px;border:1px solid var(--border);border-radius:999px;background:var(--secondary);color:var(--text);font-weight:700;cursor:pointer}.install:hover{background:#34353d}
.history{margin-top:24px}.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.history h2{font-size:18px;margin:0;font-weight:800}.history p.sub{font-size:11px;color:var(--muted);margin:5px 0 0}.count{padding:6px 11px;border-radius:999px;background:var(--secondary);color:var(--muted);font:11px monospace;white-space:nowrap}.history-grid{margin-top:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.empty{grid-column:1/-1;border:1px dashed var(--border);border-radius:16px;padding:32px 16px;text-align:center;color:var(--muted);font-size:13px}.track{overflow:hidden;border-radius:12px;background:var(--secondary)}.track-art{position:relative;aspect-ratio:1}.track-art img{width:100%;height:100%;object-fit:cover;display:block}.rank{position:absolute;left:8px;top:8px;border-radius:999px;background:rgba(23,24,32,.92);padding:4px 7px;font:11px monospace;font-weight:700}.track-info{padding:10px}.track-title,.track-artist{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-title{font-size:13px;font-weight:700}.track-artist{font-size:11px;color:var(--muted);margin-top:3px}footer{color:var(--muted);text-align:center;font:11px monospace}
.hidden{display:none}
.clear-btn{border:1px solid var(--border);background:var(--secondary);color:var(--muted);font-size:11px;padding:5px 10px;border-radius:999px;cursor:pointer;font-family:monospace}
.clear-btn:hover{color:var(--text);background:#34353d}
.history-actions{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<main>
<div class="wrap">
<section class="card" aria-label="Reproductor de radio">
<audio id="audio" preload="none"></audio>
<div class="top">
  <div class="brand"><img id="brandLogo" src="logo-radio.png" alt="sikodark"><div><div class="eyebrow">Radio online</div><div class="brand-name">sikodark</div></div></div>
  <div id="status" class="status"><span class="dot"></span><span id="statusText">Detenido</span></div>
</div>
<div id="coverBox" class="cover">
  <img id="cover" src="logo-radio.png" alt="Logo de sikodark">
  <div id="eq" class="eq"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
</div>
<div class="now"><div class="eyebrow">Sonando ahora</div><p id="title" class="title">Conectando…</p><p id="artist" class="artist"></p></div>
<div class="controls">
  <button id="play" class="play" aria-label="Reproducir"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg></button>
  <div class="volume">
    <button id="mute" class="icon-btn" aria-label="Silenciar"><svg id="volIcon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M19 9a5 5 0 0 1 0 6"/><path d="M16.5 7.5a8 8 0 0 1 0 9"/></svg></button>
    <input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volumen">
  </div>
</div>
<button id="install" class="install hidden">⇩ &nbsp; Instalar app</button>
</section>
<section class="card history" aria-labelledby="history-title">
<div class="history-head">
  <div><h2 id="history-title">◉ &nbsp;Reproducidos recientemente</h2><p class="sub">Últimas canciones reproducidas</p></div>
  <div class="history-actions">
    <span id="count" class="count">0/10 temas</span>
    <button id="clearHistory" class="clear-btn" title="Limpiar historial">Limpiar</button>
  </div>
</div>
<div id="history" class="history-grid"><p class="empty">Las canciones aparecerán aquí cuando empieces a escuchar la radio.</p></div>
</section>
</div>
<footer>sikodark radio · música en directo</footer>
</main>
<script>
/* ===== CONFIGURACIÓN PRINCIPAL ===== */
const STREAM_URL = "https://stream.zeno.fm/xdkqr4btptutv";
const LOGO = "logo-radio.png";
const MAX_HISTORY = 10;
const ZENO_MOUNT = "xdkqr4btptutv";

/* URLs de metadata con múltiples fuentes y proxies CORS */
const CORS_PROXIES = [
  "https://api.allorigins.win/raw?url=",
  "https://corsproxy.io/?",
  "" // intento directo al final
];

const METADATA_SOURCES = [
  // StreamAfrica ICY v2
  () => "https://api-v2.streamafrica.net/icyv2?url=" + encodeURIComponent(STREAM_URL),
  // Zeno API directa
  () => "https://api.zeno.fm/mounts/metadata/" + ZENO_MOUNT,
  // Radio.co / Zeno historia reciente
  () => "https://api.zeno.fm/mounts/" + ZENO_MOUNT + "/history",
];

const DEEZER_URL = "https://api.deezer.com/search";

const audio=document.getElementById("audio"), play=document.getElementById("play"), titleEl=document.getElementById("title");
const artistEl=document.getElementById("artist"), coverEl=document.getElementById("cover"), status=document.getElementById("status");
const statusText=document.getElementById("statusText"), volume=document.getElementById("volume"), mute=document.getElementById("mute");
const historyEl=document.getElementById("history"), countEl=document.getElementById("count"), install=document.getElementById("install"), eq=document.getElementById("eq");
const clearHistoryBtn=document.getElementById("clearHistory");

let isPlaying=false,isLoading=false,muted=false,cover=null;
let currentTrackTitle=null, currentTrackArtist=null;
let history=[];

/* Cargar historial desde localStorage */
try{
  history=JSON.parse(localStorage.getItem("sikodark-history")||"[]");
  if(!Array.isArray(history)) history=[];
}catch(e){ history=[]; }

audio.volume=.8;

function setPlaying(v){isPlaying=v;status.classList.toggle("live",v);statusText.textContent=v?"En vivo":"Detenido";eq.classList.toggle("playing",v);play.innerHTML=isLoading?spinner():v?pauseIcon():playIcon();play.setAttribute("aria-label",v?"Pausar":"Reproducir")}
function spinner(){return '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8" opacity=".25"/><path d="M20 12a8 8 0 0 1-8 8"/></svg>'}
function playIcon(){return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}
function pauseIcon(){return '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'}

async function startPlayback(){
  try{
    isLoading=true; play.innerHTML=spinner();
    if(!audio.src) audio.src=STREAM_URL;
    await audio.play();
  }catch(e){isLoading=false;setPlaying(false);console.error("No se pudo reproducir:",e)}
}
function stopPlayback(){audio.pause();setPlaying(false);isLoading=false}

play.onclick=()=>isPlaying?stopPlayback():startPlayback();

audio.onplaying=()=>{
  isLoading=false;
  setPlaying(true);
  // Intentar guardar en historial si ya tenemos metadata
  if(currentTrackTitle) addCurrentToHistory();
};
audio.onwaiting=()=>{isLoading=true;play.innerHTML=spinner()};
audio.onpause=()=>{if(!audio.ended){isLoading=false;setPlaying(false)}};
audio.onerror=()=>{isLoading=false;setPlaying(false)};

volume.oninput=()=>{audio.volume=Number(volume.value);muted=false;audio.muted=false};
mute.onclick=()=>{muted=!muted;audio.muted=muted;mute.innerHTML=muted?'<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>':'<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M19 9a5 5 0 0 1 0 6"/><path d="M16.5 7.5a8 8 0 0 1 0 9"/></svg>'};

/* Botón limpiar historial */
clearHistoryBtn.onclick=()=>{
  if(confirm("¿Seguro que quieres borrar el historial de reproducción?")){
    history=[];
    localStorage.setItem("sikodark-history","[]");
    renderHistory();
  }
};

function parseTitle(raw){
  raw=(raw||"").trim();
  if(!raw)return{title:"En vivo",artist:null};
  let i=raw.indexOf(" - ");
  if(i>0) return{artist:raw.slice(0,i).trim(),title:raw.slice(i+3).trim()};
  // Intentar con "–" (guion largo)
  i=raw.indexOf(" – ");
  if(i>0) return{artist:raw.slice(0,i).trim(),title:raw.slice(i+3).trim()};
  // Intentar con "-" sin espacios
  i=raw.indexOf("-");
  if(i>0 && i<raw.length-1) return{artist:raw.slice(0,i).trim(),title:raw.slice(i+1).trim()};
  return{title:raw,artist:null};
}

function setTrack(t, artFromApi=null){
  const nextTitle=(t.title||"En vivo").trim();
  const nextArtist=(t.artist||"").trim()||null;
  
  // Detectar si realmente cambió la canción
  const trackChanged = nextTitle !== currentTrackTitle || nextArtist !== currentTrackArtist;
  
  // Actualizar DOM
  titleEl.textContent=nextTitle;
  artistEl.textContent=nextArtist||"";
  cover=artFromApi||null;
  coverEl.src=cover||LOGO;
  
  // Guardar referencia actual
  currentTrackTitle = nextTitle;
  currentTrackArtist = nextArtist;
  
  updateMediaSession({title:nextTitle,artist:nextArtist},cover||LOGO);
  
  // ✅ GUARDAR EN HISTORIAL SIEMPRE QUE CAMBIE LA CANCIÓN
  if(trackChanged && nextTitle && !["Conectando…","En vivo","En Vivo","EN VIVO"].includes(nextTitle)){
    const historyItem = {title:nextTitle, artist:nextArtist, cover:cover||LOGO, ts:Date.now()};
    upsertHistory(historyItem);
    // Buscar carátula si no la tenemos
    if(!cover) fetchCover({title:nextTitle,artist:nextArtist});
  }
}

/* ===== FUNCIÓN DE HISTORIAL CORREGIDA ===== */
function upsertHistory(item){
  if(!item || !item.title) return;
  
  // No guardar títulos genéricos
  const skipTitles = ["Conectando…","En vivo","En Vivo","EN VIVO","Conectando","Loading...","Loading"];
  if(skipTitles.includes(item.title.trim())) return;
  
  // Normalizar: asegurar que tenga cover
  item.cover = item.cover || LOGO;
  
  // Buscar si ya existe (mismo título y artista)
  const sameAs = (x) => 
    x.title.toLowerCase().trim() === item.title.toLowerCase().trim() && 
    ((x.artist||"").toLowerCase().trim() === (item.artist||"").toLowerCase().trim());
  
  const existingIndex = history.findIndex(sameAs);
  
  if(existingIndex >= 0){
    // Ya existe: mover al principio y actualizar cover si es mejor
    const existing = history[existingIndex];
    // Si el nuevo item tiene una portada mejor (no es el logo), actualizarla
    if(item.cover !== LOGO && existing.cover === LOGO){
      existing.cover = item.cover;
    }
    existing.ts = item.ts || Date.now();
    // Quitar de su posición actual
    history.splice(existingIndex, 1);
    // Poner al principio
    history.unshift(existing);
  }else{
    // Nuevo item: agregar al principio
    history.unshift({...item});
  }
  
  // Limitar a MAX_HISTORY
  history = history.slice(0, MAX_HISTORY);
  
  // Guardar en localStorage
  try{
    localStorage.setItem("sikodark-history", JSON.stringify(history));
  }catch(e){
    console.warn("No se pudo guardar en localStorage:", e);
  }
  
  // Actualizar UI
  renderHistory();
}

function addCurrentToHistory(){
  if(!currentTrackTitle) return;
  upsertHistory({
    title: currentTrackTitle,
    artist: currentTrackArtist,
    cover: cover || LOGO,
    ts: Date.now()
  });
}

function renderHistory(){
  countEl.textContent = history.length + "/" + MAX_HISTORY + " temas";
  
  if(!history.length){
    historyEl.innerHTML = '<p class="empty">Las canciones aparecerán aquí cuando empieces a escuchar la radio.</p>';
    return;
  }
  
  historyEl.innerHTML = history.map((x,i) => `
    <article class="track">
      <div class="track-art">
        <img src="${esc(x.cover||LOGO)}" alt="Carátula de ${esc(x.title)}" 
             onerror="this.onerror=null;this.src='${LOGO}'">
        <span class="rank">#${i+1}</span>
      </div>
      <div class="track-info">
        <p class="track-title">${esc(x.title)}</p>
        <p class="track-artist">${esc(x.artist||"sikodark radio")}</p>
      </div>
    </article>
  `).join("");
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function updateMediaSession(t,art){
  if(!("mediaSession" in navigator)) return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:t.title||"sikodark radio",
      artist:t.artist||"sikodark radio",
      album:"sikodark radio",
      artwork:[
        {src:art||LOGO,sizes:"512x512"},
        {src:art||LOGO,sizes:"256x256"},
        {src:art||LOGO,sizes:"192x192"}
      ]
    });
  }catch(e){ console.warn("Media Session",e); }
}

/* ===== BUSCAR CARÁTULAS ===== */
async function fetchCover(t){
  if(!t.title || ["En vivo","En Vivo","EN VIVO"].includes(t.title)) return null;
  
  const query = [t.artist, t.title].filter(Boolean).join(" ");
  
  // Deezer
  try{
    const q = encodeURIComponent(query);
    const r = await fetch(DEEZER_URL + "?limit=5&q=" + q, {cache:"no-store"});
    if(r.ok){
      const d = await r.json();
      const tracks = Array.isArray(d.data) ? d.data : [];
      const tr = tracks[0];
      const url = tr?.album?.cover_xl || tr?.album?.cover_big || tr?.album?.cover_medium || tr?.artist?.picture_big || null;
      if(url){
        cover = url;
        coverEl.src = url;
        updateMediaSession(t, url);
        // Actualizar el historial con la nueva portada
        updateHistoryCover(t.title, t.artist, url);
        return url;
      }
    }
  }catch(e){ console.warn("Deezer no disponible", e); }
  
  // iTunes fallback
  try{
    const r = await fetch("https://itunes.apple.com/search?term=" + encodeURIComponent(query) + "&entity=song&limit=5", {cache:"no-store"});
    if(r.ok){
      const d = await r.json();
      const tr = (d.results || [])[0];
      const url = tr?.artworkUrl100?.replace(/\d+x\d+/, "600x600") || null;
      if(url){
        cover = url;
        coverEl.src = url;
        updateMediaSession(t, url);
        updateHistoryCover(t.title, t.artist, url);
        return url;
      }
    }
  }catch(e){ console.warn("iTunes no disponible", e); }
  
  return null;
}

function updateHistoryCover(title, artist, coverUrl){
  let changed = false;
  history = history.map(x => {
    if(x.title.toLowerCase().trim() === title.toLowerCase().trim() &&
       (x.artist||"").toLowerCase().trim() === (artist||"").toLowerCase().trim() &&
       x.cover === LOGO){
      changed = true;
      return {...x, cover: coverUrl};
    }
    return x;
  });
  if(changed){
    try{ localStorage.setItem("sikodark-history", JSON.stringify(history)); }catch(e){}
    renderHistory();
  }
}

/* ===== NORMALIZAR METADATA ===== */
function normalizeMetadata(d){
  if(!d || typeof d !== "object") return null;
  
  // Intentar extraer título de varias formas
  let title = d.title || d.song || d.track || d.TITLE || d.Song || null;
  let artist = d.artist || d.artists || d.ARTIST || d.Artist || null;
  let art = d.artwork || d.art || d.cover || d.cover_xl || d.cover_big || d.image || d.picture || null;
  
  // Si no hay título pero hay streamTitle
  if(!title && typeof d.streamTitle === "string") return parseTitle(d.streamTitle);
  if(!title && typeof d.StreamTitle === "string") return parseTitle(d.StreamTitle);
  
  // Si el título contiene " - " y no hay artista, parsear
  if(title && typeof title === "string" && title.includes(" - ") && !artist){
    return parseTitle(title);
  }
  
  if(Array.isArray(artist)) artist = artist.join(", ");
  
  return title ? {title: String(title).trim(), artist: artist ? String(artist).trim() : null, art: art || null} : null;
}

/* ===== MERGEAR HISTORIAL DESDE API ===== */
function mergeApiHistory(items){
  if(!Array.isArray(items) || items.length === 0) return;
  
  // Procesar en orden inverso para que las más nuevas queden al final
  for(const raw of items.slice(0, MAX_HISTORY).reverse()){
    const t = normalizeMetadata({
      title: raw.song || raw.title || raw.track || raw.Song,
      artist: raw.artist || raw.Artist,
      artwork: raw.artwork || raw.art || raw.cover || raw.image
    });
    if(t?.title){
      upsertHistory({title: t.title, artist: t.artist, cover: t.art || LOGO, ts: Date.now()});
    }
  }
}

/* ===== FETCH CON PROXY CORS ===== */
async function fetchWithCors(url){
  for(const proxy of CORS_PROXIES){
    try{
      const fullUrl = proxy ? proxy + encodeURIComponent(url) : url;
      const r = await fetch(fullUrl, {cache: "no-store"});
      if(r.ok){
        const text = await r.text();
        try{ return JSON.parse(text); }
        catch(e){ 
          // Si no es JSON, devolver texto
          return {_raw: text, _url: url};
        }
      }
    }catch(e){
      // Continuar con el siguiente proxy
    }
  }
  throw new Error("Todos los proxies fallaron");
}

/* ===== POLLING DE METADATA ===== */
async function pollMetadata(){
  for(const getUrl of METADATA_SOURCES){
    try{
      const url = getUrl();
      const d = await fetchWithCors(url);
      
      // Si es la URL de history de Zeno
      if(url.includes("/history") && Array.isArray(d)){
        mergeApiHistory(d);
        // Intentar obtener el actual (primero de la lista)
        if(d.length > 0){
          const current = normalizeMetadata(d[0]);
          if(current) setTrack(current, current.art || null);
        }
        return true;
      }
      
      // StreamAfrica: puede tener history
      if(d && Array.isArray(d.history)){
        mergeApiHistory(d.history);
      }
      
      // Normalizar y establecer track actual
      const t = normalizeMetadata(d);
      if(t){
        setTrack(t, t.art || null);
        return true;
      }
    }catch(e){
      // Continuar con la siguiente fuente
    }
  }
  
  // Si nada funcionó, intentar extraer metadata directamente del stream de audio
  tryPollAudioMetadata();
  return false;
}

/* ===== INTENTAR OBTENER METADATA DEL AUDIO ===== */
function tryPollAudioMetadata(){
  try{
    // Algunos navegadores exponen metadatos ICY
    if(audio.getMetadata){
      const meta = audio.getMetadata();
      const t = normalizeMetadata(meta);
      if(t) setTrack(t, null);
    }
  }catch(e){}
}

/* ===== CONEXIÓN DE METADATA ===== */
let metadataTimer = null;

async function connectMetadata(){
  // Primera carga inmediata
  await pollMetadata();
  
  // Configurar polling cada 8 segundos
  if(metadataTimer) clearInterval(metadataTimer);
  metadataTimer = setInterval(pollMetadata, 8000);
  
  // Intentar EventSource de Zeno como bonus
  try{
    const es = new EventSource("https://api.zeno.fm/mounts/metadata/subscribe/" + ZENO_MOUNT);
    es.onmessage = e => {
      try{
        const d = JSON.parse(e.data);
        const t = normalizeMetadata(d);
        if(t) setTrack(t, t.art || null);
      }catch(err){}
    };
    es.onerror = () => { try{ es.close(); }catch(_){} };
  }catch(e){}
}

/* ===== INSTALL PWA ===== */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  install.classList.remove("hidden");
});
install.onclick = async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  install.classList.add("hidden");
};

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ===== MEDIA SESSION ===== */
if("mediaSession" in navigator){
  try{
    navigator.mediaSession.setActionHandler("play", () => startPlayback());
    navigator.mediaSession.setActionHandler("pause", () => stopPlayback());
    navigator.mediaSession.setActionHandler("stop", () => stopPlayback());
  }catch(e){}
}

/* ===== INICIALIZACIÓN ===== */
// Renderizar historial guardado inmediatamente
renderHistory();

// Conectar metadata
connectMetadata();

// Si es archivo local, advertir
if(location.protocol === "file:" || location.protocol === "content:"){
  console.warn("sikodark: abre esta versión desde GitHub Pages para obtener metadata y carátulas.");
  // Para pruebas locales: agregar datos de ejemplo al historial si está vacío
  if(history.length === 0){
    console.log("Modo demo: historial vacío. Agrega canciones desde GitHub Pages.");
  }
}
