<html style="margin:0;padding:0;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="margin:0;padding:0;background:#171820;color:#f5f5f7;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;">

<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 16px 40px;box-sizing:border-box;">
<div style="width:100%;max-width:448px;">

<!-- ===== REPRODUCTOR PRINCIPAL ===== -->
<div style="border:1px solid rgba(255,255,255,.1);background:#22232b;border-radius:28px;padding:24px;box-shadow:0 20px 55px rgba(0,0,0,.35);">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:9px;">
      <!-- LOGO SIKODARK EN LA ESQUINA SUPERIOR -->
      <img src="https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/667338460afb4a77bfb024b5f6fd3773.jpeg" alt="sikodark" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,138,36,.3);">
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#a5a6ad;font-family:ui-monospace,Menlo,monospace;">Radio online</div>
        <div style="font-size:14px;font-weight:700;margin-top:2px;">sikodark</div>
      </div>
    </div>
    <div id="statusBadge" style="display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 11px;font:11px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,138,36,.14);color:#ff8a24;">
      <span style="width:8px;height:8px;border-radius:50%;background:#ff8a24;animation:pulse 1.2s infinite;"></span>
      <span id="statusText">En vivo</span>
    </div>
  </div>

  <!-- CARÁTULA PRINCIPAL -->
  <div style="position:relative;margin-top:24px;width:100%;padding-top:100%;border-radius:20px;overflow:hidden;background:#2c2d35;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);">
    <img id="coverImg" src="https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/90cc1b3c5c474beb86defef817a4ee76.jpeg" alt="Carátula actual" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s ease;">
  </div>

  <!-- INFO CANCIÓN -->
  <div style="margin-top:24px;min-height:64px;text-align:center;">
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#a5a6ad;font-family:ui-monospace,Menlo,monospace;margin-bottom:5px;">Sonando ahora</div>
    <p id="titleNow" style="margin:0;font-size:20px;font-weight:800;line-height:1.25;letter-spacing:-.01em;">Eclipse Serenade</p>
    <p id="artistNow" style="margin:5px 0 0;color:#a5a6ad;font-size:14px;font-weight:500;">Mountain Echoes</p>
    <div style="font-size:10px;color:#a5a6ad;font-family:ui-monospace,Menlo,monospace;margin-top:8px;text-align:center;opacity:.6;">via Zeno API</div>
  </div>

  <!-- CONTROLES -->
  <div style="margin-top:28px;display:flex;align-items:center;gap:16px;">
    <button id="playBtn" aria-label="Pausar" style="position:relative;width:68px;height:68px;flex:0 0 68px;border:0;border-radius:50%;display:grid;place-items:center;background:#ff8a24;color:#1a1a1a;cursor:pointer;box-shadow:0 6px 20px rgba(255,138,36,.25);transition:transform .15s,box-shadow .15s;">
      <div style="position:relative;width:30px;height:30px;display:grid;place-items:center;">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" style="position:absolute;opacity:0;transform:scale(.6);transition:transform .2s,opacity .15s;width:30px;height:30px;">
          <path d="M7.5 5.14c0-.9 1.03-1.44 1.78-.94l10.5 7.03c.73.49.73 1.55 0 2.04l-10.5 7.03c-.75.5-1.78-.04-1.78-.94V5.14z"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="position:absolute;opacity:1;transform:scale(1);transition:transform .2s,opacity .15s;width:30px;height:30px;">
          <rect x="6.5" y="5" width="4" height="14" rx="1.5"/>
          <rect x="13.5" y="5" width="4" height="14" rx="1.5"/>
        </svg>
      </div>
    </button>
    <div style="display:flex;align-items:center;gap:12px;flex:1;">
      <button id="muteBtn" aria-label="Silenciar" style="border:0;background:none;color:#a5a6ad;cursor:pointer;padding:6px;display:grid;place-items:center;border-radius:12px;transition:color .2s,background .2s;">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z"/>
          <path d="M19 9a5 5 0 0 1 0 6"/>
          <path d="M16.5 7.5a8 8 0 0 1 0 9"/>
        </svg>
      </button>
      <input type="range" min="0" max="1" step=".01" value=".8" aria-label="Volumen" style="width:100%;height:6px;background:#2c2d35;border-radius:999px;outline:none;cursor:pointer;accent-color:#ff8a24;-webkit-appearance:none;">
    </div>
  </div>

  <button id="refreshBtn" style="margin-top:16px;width:100%;padding:10px;border-radius:14px;font-size:12px;border:1px solid rgba(255,255,255,.1);background:#2c2d35;color:#a5a6ad;font-family:ui-monospace,Menlo,monospace;cursor:pointer;transition:color .2s,background .2s;">
    ↻ Actualizar metadata
  </button>

</div>

<!-- ===== HISTORIAL ===== -->
<div style="margin-top:24px;border:1px solid rgba(255,255,255,.1);background:#22232b;border-radius:28px;padding:24px;box-shadow:0 20px 55px rgba(0,0,0,.35);">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
    <div>
      <h2 style="font-size:18px;margin:0;font-weight:800;">
        <span style="color:#ff8a24;">●</span>&nbsp; Reproducidos recientemente
      </h2>
      <p style="font-size:11px;color:#a5a6ad;margin:5px 0 0;">Toca el icono para compartir</p>
    </div>
    <span style="padding:6px 11px;border-radius:999px;background:#2c2d35;color:#a5a6ad;font:11px ui-monospace,Menlo,monospace;white-space:nowrap;" id="countLabel">5/10 temas</span>
  </div>

  <div id="historyGrid" style="margin-top:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;"></div>
</div>

<div style="color:#a5a6ad;text-align:center;font:11px ui-monospace,Menlo,monospace;margin-top:24px;">sikodark radio · música en directo · PWA</div>

</div>
</div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,31,40,.95);backdrop-filter:blur(12px);color:#f5f5f7;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 40px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.34,1.56,.64,1);z-index:9999;">Listo</div>

</body>

<script>
(function(){
  const styleEl = document.createElement('style');
  styleEl.textContent = `
    @keyframes pulse{50%{opacity:.35}}
    #playBtn:hover{transform:scale(1.05);box-shadow:0 8px 24px rgba(255,138,36,.3);}
    #playBtn:active{transform:scale(.94);}
    #muteBtn:hover{color:#f5f5f7;background:#2c2d35;}
    #refreshBtn:hover{color:#f5f5f7;background:#34353d;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#ff8a24;cursor:pointer;box-shadow:0 2px 8px rgba(255,138,36,.25);transition:transform .15s;}
    input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2);}
    .track{overflow:hidden;border-radius:14px;background:#2c2d35;transition:transform .2s ease,box-shadow .2s,background .2s;position:relative;}
    .track:hover{background:#2a2b35;transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25);}
    .track-art{position:relative;aspect-ratio:1;overflow:hidden;}
    @supports not (aspect-ratio:1){.track-art{padding-top:100%;height:0;}.track-art img{position:absolute;top:0;left:0;}}
    .track-art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease;}
    .track:hover .track-art img{transform:scale(1.05);}
    .share-btn{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.6);width:34px;height:34px;border-radius:50%;background:#ff8a24;display:grid;place-items:center;opacity:0;transition:all .2s ease;border:0;cursor:pointer;padding:0;z-index:2;}
    .track:hover .share-btn{opacity:1;transform:translateX(-50%) scale(1);}
    .share-btn:hover{background:#ff9f4a;transform:translateX(-50%) scale(1.12) !important;}
    .share-btn:active{transform:translateX(-50%) scale(.92) !important;}
    .share-btn svg{width:16px;height:16px;fill:none;stroke:#1a1a1a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
    .rank{position:absolute;left:8px;bottom:8px;border-radius:999px;background:rgba(23,24,32,.85);padding:4px 8px;font:11px ui-monospace,Menlo,monospace;font-weight:700;border:1px solid rgba(255,255,255,.08);color:#f5f5f7;}
    .track-info{padding:12px;}
    .track-title,.track-artist{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .track-title{font-size:13px;font-weight:700;letter-spacing:-.01em;color:#f5f5f7;}
    .track-artist{font-size:11px;color:#a5a6ad;margin-top:3px;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    @media (min-width:1280px){.wrap{max-width:520px;}#titleNow{font-size:24px;}#artistNow{font-size:16px;}#playBtn{width:76px;height:76px;flex:0 0 76px;}.track-title{font-size:15px;}.track-artist{font-size:12px;}}
  `;
  document.head.appendChild(styleEl);

  const LOGO_SIKODARK = "https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/667338460afb4a77bfb024b5f6fd3773.jpeg";
  const sampleHistory = [
    {title:"Eclipse Serenade", artist:"Mountain Echoes", cover:"https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/90cc1b3c5c474beb86defef817a4ee76.jpeg"},
    {title:"Neon Circuit", artist:"Volt Runners", cover:"https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/4582bfe68243451fad4d779bbbf831cb.jpeg"},
    {title:"Fiesta Tropical", artist:"Mariana Lopez", cover:"https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/8c3cc31743e248eba1e84378a8db9e47.jpeg"},
    {title:"Ethereal Ballads", artist:"Luna Sky", cover:"https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/06001fdec095451eb24f36e72277a80d.jpeg"},
    {title:"Acoustic Memories", artist:"The Wanderers", cover:"https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/45144c62808a47938445fdc6fee7fcf2.jpeg"},
  ];

  let isPlaying = true, currentSongIdx = 0, muted = false, toastTimer = null;
  const historyGrid = document.getElementById('historyGrid');
  const toast = document.getElementById('toast');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = playBtn.querySelector('.icon-play');
  const iconPause = playBtn.querySelector('.icon-pause');
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  const coverImg = document.getElementById('coverImg');
  const titleNow = document.getElementById('titleNow');
  const artistNow = document.getElementById('artistNow');
  const countLabel = document.getElementById('countLabel');
  const refreshBtn = document.getElementById('refreshBtn');
  const muteBtn = document.getElementById('muteBtn');

  function showToast(msg, d=2200){toast.textContent=msg;toast.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),d);}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

  function renderHistory(){
    countLabel.textContent=sampleHistory.length+"/10 temas";
    historyGrid.innerHTML=sampleHistory.map((x,i)=>`
      <article class="track">
        <div class="track-art">
          <img src="${esc(x.cover)}" alt="Carátula de ${esc(x.title)}" loading="lazy" onerror="this.onerror=null;this.src='${LOGO_SIKODARK}'">
          <button class="share-btn" data-idx="${i}" aria-label="Compartir ${esc(x.title)}" title="Compartir">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
          <span class="rank">#${i+1}</span>
        </div>
        <div class="track-info"><p class="track-title">${esc(x.title)}</p><p class="track-artist">${esc(x.artist||"sikodark radio")}</p></div>
      </article>
    `).join("");
    historyGrid.querySelectorAll('.share-btn').forEach(btn=>{
      btn.onclick=async(e)=>{
        e.stopPropagation();
        const t=sampleHistory[parseInt(btn.dataset.idx)];
        const text=`${t.title}${t.artist?` - ${t.artist}`:""}\n\nEscuchandola en sikodark radio`;
        const title=t.artist?`${t.artist} - ${t.title}`:t.title;
        if(navigator.share){try{await navigator.share({title,text,url:location.href});showToast("Compartido!");return;}catch(err){if(err.name==="AbortError")return;}}
        try{await navigator.clipboard.writeText(`${text}\n${location.href}`);showToast("Copiado al portapapeles");}catch(err){showToast("No se pudo compartir");}
      };
    });
  }

  function setPlayingUI(v){
    isPlaying=v;
    iconPlay.style.opacity=v?"0":"1";iconPlay.style.transform=v?"scale(.6)":"translateX(2px) scale(1)";
    iconPause.style.opacity=v?"1":"0";iconPause.style.transform=v?"scale(1)":"scale(.6)";
    playBtn.setAttribute("aria-label",v?"Pausar":"Reproducir");
    statusBadge.style.background=v?"rgba(255,138,36,.14)":"#2c2d35";
    statusBadge.style.color=v?"#ff8a24":"#a5a6ad";
    statusText.textContent=v?"En vivo":"Detenido";
    const dot=statusBadge.querySelector('span:first-child');
    dot.style.background=v?"#ff8a24":"#a5a6ad";
    dot.style.animation=v?"pulse 1.2s infinite":"none";
  }

  playBtn.onclick=()=>{setPlayingUI(!isPlaying);showToast(isPlaying?"Reproduciendo":"Pausa");};
  refreshBtn.onclick=()=>{
    refreshBtn.textContent="↻ Buscando...";refreshBtn.disabled=true;
    setTimeout(()=>{
      currentSongIdx=(currentSongIdx+1)%sampleHistory.length;
      const s=sampleHistory[currentSongIdx];
      coverImg.style.opacity="0";
      setTimeout(()=>{coverImg.src=s.cover;titleNow.textContent=s.title;artistNow.textContent=s.artist;coverImg.onload=()=>coverImg.style.opacity="1";},150);
      refreshBtn.textContent="↻ Actualizar metadata";refreshBtn.disabled=false;
      showToast("Metadata actualizada");
    },700);
  };
  muteBtn.onclick=()=>{muted=!muted;muteBtn.style.color=muted?"#ff8a24":"";showToast(muted?"Silenciado":"Sonido activado");};

  renderHistory();
  setPlayingUI(true);
})();
</script>
</html>
